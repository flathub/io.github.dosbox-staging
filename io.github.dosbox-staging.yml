app-id: io.github.dosbox-staging
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

command: dosbox

build_options:
  cppflags: -DNDEBUG
  cflags: -O3
  cxxflags: -O3

rename-desktop-file: org.dosbox_staging.dosbox_staging.desktop
#rename-appdata-file: org.dosbox_staging.dosbox_staging.metainfo.xml
rename-icon: org.dosbox_staging.dosbox_staging

finish-args:
  - --device=all          # we need OpenGL and controller access
  - --share=network       # IPX, libslirp and serial port emulation over UDP
  - --socket=fallback-x11 # X11 output support
  - --socket=wayland      # Wayland output support
  - --share=ipc           # necessary for x11
  - --socket=pulseaudio
  - --filesystem=home
  - --filesystem=xdg-run/pipewire-0:ro

cleanup-commands:
  - find /app -name 1024x1024 -exec rm -rf {} +

modules:

  # Build FluidSynth for General MIDI emulation
  - shared-modules/linux-audio/fluidsynth2.json

  - shared-modules/SDL2/SDL2_image.json

  # Build iir1 DSP filter lib
  - name: iir1
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/berndporr/iir1/archive/refs/tags/1.10.0.tar.gz
        sha256: 13b53f14d276adf6cafd3564fcda1d4b3e72342108d1c40ec4b4f0c7fc3ac95a
        x-checker-data:
          type: anitya
          project-id: 288170
          url-template: https://github.com/berndporr/iir1/archive/refs/tags/$version.tar.gz

  # Build mt32emu for MT-32 MIDI emulation
  - name: mt32emu
    buildsystem: cmake-ninja
    config-opts:
      - -Dmunt_WITH_MT32EMU_SMF2WAV=FALSE
      - -Dmunt_WITH_MT32EMU_QT=FALSE
      - -Dlibmt32emu_WITH_VERSION_TAGGING=TRUE
      - -Dlibmt32emu_WITH_SYMBOL_VERSIONING=TRUE
    sources:
      - type: archive
        url: https://github.com/munt/munt/archive/libmt32emu_2_8_3.tar.gz
        sha256: 81f8c462f46bc8901618762ae34cf9de93894ff81f41db73c79472fa3baef875
        x-checker-data:
          type: anitya
          project-id: 220368
          url-template: https://github.com/munt/munt/archive/libmt32emu_$version.tar.gz

  # Build libslirp for TCP/IP networking
  - name: libslirp
    buildsystem: meson
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v4.9.4/libslirp-v4.9.4.tar.gz
        sha256: 3998863b020aeda34bddc567097c6efba55a78cdf6eeee6bcd42c11ef23967da
        x-checker-data:
          type: anitya
          project-id: 96796
          url-template: https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v$version/libslirp-v$version.tar.gz

  - name: zlib-ng
    buildsystem: cmake-ninja
    config-opts:
      - -DZLIB_ENABLE_TESTS=false
    sources:
      - type: archive
        url: https://github.com/zlib-ng/zlib-ng/archive/refs/tags/2.3.3.tar.gz
        sha256: f9c65aa9c852eb8255b636fd9f07ce1c406f061ec19a2e7d508b318ca0c907d1
        x-checker-data:
          type: anitya
          project-id: 115592
          url-template: https://github.com/zlib-ng/zlib-ng/archive/refs/tags/$version.tar.gz

  - name: opusfile
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://ftp.osuosl.org/pub/xiph/releases/opus/opusfile-0.12.tar.gz
        sha256: 118d8601c12dd6a44f52423e68ca9083cc9f2bfe72da7a8c1acb22a80ae3550b
        x-checker-data:
          type: anitya
          project-id: 10353
          url-template: https://ftp.osuosl.org/pub/xiph/releases/opus/opusfile-$version.tar.gz

  - name: asio
    buildsystem: simple
    build-commands:
      - cp -a include/. /app/include/
    sources:
      - type: archive
        url: https://altushost-bul.dl.sourceforge.net/project/asio/asio/1.38.2%20%28Stable%29/asio-1.38.2.tar.gz
        sha256: 4893ad026013d1f64bf111c606e6abd857bb953823a4744e449969f1063fd9ce
        x-checker-data:
          type: anitya
          project-id: 117
          url-template: https://altushost-bul.dl.sourceforge.net/project/asio/asio/$version%20%28Stable%29/asio-$version.tar.gz

  # Build DOSBox-Staging
  - name: dosbox-staging
    buildsystem: cmake
    config-opts:
      - -DOPT_TESTS=OFF
      - -DCMAKE_BUILD_TYPE=Release
      - -DUSE_SYSTEM_LIBS=ON
    sources:
      - type: archive
        url: https://github.com/dosbox-staging/dosbox-staging/archive/refs/tags/v0.83.0.tar.gz
        sha256: 9b36be5a666784adaeffa560bd0950691f851a76bdb97e7ae3c989561e91caf3
        x-checker-data:
          type: anitya
          project-id: 234902
          url-template: https://github.com/dosbox-staging/dosbox-staging/archive/refs/tags/v$version.tar.gz
      - type: file
        path: org.dosbox-staging.dosbox-staging.metainfo.xml
      - type: patch
        path: fix-sdl2-includes.patch
    post-install:
      # DOSBox Staging expects shaders and other resources directly below
      # /app/share/dosbox-staging, but the 0.83.x CMake install places them
      # one level lower in the resources directory.
      - cp -a /app/share/dosbox-staging/resources/. /app/share/dosbox-staging/
      - rm -rf /app/share/dosbox-staging/resources
      # CMake install copies a bunch of meson.build files which are not needed.
      - find /app/share/dosbox-staging -name meson.build -delete
      # Replace the upstream metadata with the Flatpak-specific metadata.
      - rm -f /app/share/metainfo/org.dosbox_staging.dosbox_staging.metainfo.xml
      - install -Dm644 org.dosbox-staging.dosbox-staging.metainfo.xml /app/share/metainfo/io.github.dosbox-staging.metainfo.xml
